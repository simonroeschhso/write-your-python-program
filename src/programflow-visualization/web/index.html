<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none';
                 style-src {{CSP_SOURCE}} 'unsafe-inline';
                 script-src 'nonce-{{NONCE}}' {{CSP_SOURCE}};
                 img-src {{CSP_SOURCE}} data:;
                 connect-src {{CSP_SOURCE}};
                 font-src {{CSP_SOURCE}};" />

  <link rel="stylesheet" href="{{WEBVIEW_CSS}}" />
  <title>Code Visualization</title>
</head>

<body>
  <div class="column scrollable" id="viz">
    <!-- ELK-based visualization, see elk-task/elk-plan.md -->
    <!-- #elk-viewport clips and receives the pan/zoom gestures, #elk-canvas is transformed -->
    <div id="elk-viewport">
      <div id="elk-canvas"></div>
    </div>
  </div>

  <div class="row" id="bottom-area">
    <div class="column floating-left">
      <div class="slidecontainer">
        <input
          type="range"
          min="0"
          max="0"
          value="0"
          class="slider"
          id="traceSlider"
        />
      </div>

      <div class="row margin-vertical">
        <p>Step&nbsp;</p>
        <p id="indexCounter">0</p>
        <p id="traceMax">/?</p>
      </div>

      <div class="row margin-vertical">
        <button class="margin-horizontal" id="firstButton" type="button" aria-label="Go to first step" title="First step">&#9198</button>
        <button class="margin-horizontal" id="prevButton" type="button" aria-label="Go to previous step" title="Previous step">&#9664</button>
        <button class="margin-horizontal" id="nextButton" type="button" aria-label="Go to next step" title="Next step">&#9654</button>
        <button class="margin-horizontal" id="lastButton" type="button" aria-label="Go to last step" title="Last step">&#9197</button>
        <button class="margin-horizontal" id="expandAllButton" type="button" title="Expand every collapsed object" hidden>Expand all</button>
        <button class="margin-horizontal" id="fitButton" type="button" title="Zoom to fit">Fit</button>
      </div>
    </div>

    <div class="column floating-right">
      <pre class="scrollable" id="stdout-log"></pre>
    </div>
  </div>

  <!-- scripts -->
  <!-- example trace for web-dev -->
  <script nonce="{{NONCE}}" src="./example-trace-content.js"></script>

  <script nonce="{{NONCE}}" src="{{VSCODE_HOST_ADAPTER_JS}}"></script>

  <script nonce="{{NONCE}}" src="{{WEBVIEW_JS}}"></script>

</body>
</html>
